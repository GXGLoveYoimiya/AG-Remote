<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72" width="256" height="256">
  <!-- Same artwork as the Android launcher icon (res/drawable/ic_fg.xml + ic_bg.xml), cropped to the
       visible 72x72 area of the 108x108 adaptive icon and given a rounded-square background. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FF"/>
    </linearGradient>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="25" y1="54" x2="83" y2="54">
      <stop offset="0" stop-color="#2563EB"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="star" gradientUnits="userSpaceOnUse" x1="31" y1="31" x2="77" y2="77">
      <stop offset="0" stop-color="#2563EB"/><stop offset=".45" stop-color="#38BDF8"/>
      <stop offset=".8" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="25" y1="64" x2="83" y2="48">
      <stop offset="0" stop-color="#2563EB"/><stop offset=".45" stop-color="#22D3EE"/>
      <stop offset=".82" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="dot" gradientUnits="userSpaceOnUse" x1="73" y1="44" x2="79" y2="50">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="18.5" y="18.5" width="71" height="71" rx="16" fill="url(#bg)" stroke="#DCE3F2" stroke-width=".6"/>
  <g transform="rotate(-42 54 54)" fill="none" stroke-linecap="round">
    <path d="M26.75,50.31 A29,10.8 0 0,1 67.61,44.46" stroke="url(#back)" stroke-width="3.4"/>
  </g>
  <path d="M54,31 C55.2,45.5 62.5,52.8 77,54 C62.5,55.2 55.2,62.5 54,77 C52.8,62.5 45.5,55.2 31,54 C45.5,52.8 52.8,45.5 54,31 Z" fill="url(#star)"/>
  <g transform="rotate(-42 54 54)" fill="none" stroke-linecap="round">
    <path d="M82.01,56.80 A29,10.8 0 0,1 25.44,55.88" stroke="#FFFFFF" stroke-width="7.4"/>
    <path d="M81.58,50.66 A29,10.8 0 1,1 26.75,50.31" stroke="url(#front)" stroke-width="3.5"/>
    <path d="M73.12,47.06 A3.1,3.1 0 1,0 79.32,47.06 A3.1,3.1 0 1,0 73.12,47.06 Z" fill="url(#dot)"/>
  </g>
</svg>
