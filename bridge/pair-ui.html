<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AG Remote</title>
<link rel="icon" href="/admin/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --text: #1b1d22; --muted: #646b78; --line: #e3e6ec;
    --accent: #3b6ef5; --accent-weak: #e8eeff; --ok: #1e9e5a; --ok-weak: #e3f6ec;
    --warn: #b86e00; --warn-weak: #fff3dc; --danger: #d13d3d; --code-bg: #f0f3ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --card: #1c1e24; --text: #e9ebf0; --muted: #9aa1ad; --line: #2c2f37;
      --accent: #7c9dff; --accent-weak: #232c47; --ok: #4fd18b; --ok-weak: #17301f;
      --warn: #ffb547; --warn-weak: #33280f; --danger: #ff6b6b; --code-bg: #20263a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", "Yu Gothic UI", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 48px; }
  body { overflow-x: hidden; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo { width: 44px; height: 44px; flex: none; }
  h1 { font-size: 21px; margin: 0; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 2px 0 0; }
  .grow { flex: 1; min-width: 0; }
  header .grow { min-width: 220px; }
  select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px; font-size: 13px; background: var(--card); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok .dot { background: var(--ok); } .pill.bad .dot { background: var(--danger); } .pill.warn .dot { background: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .row2 { grid-template-columns: 1fr; } }
  .big { font: 700 40px/1.1 "Cascadia Mono", Consolas, "SF Mono", monospace; letter-spacing: .14em; background: var(--code-bg); border-radius: 14px; padding: 14px 16px; text-align: center; user-select: all; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; overflow-wrap: anywhere; }
  .addr { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--code-bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 17px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13.5px; border: 0; border-radius: 10px; padding: 7px 14px; cursor: pointer; background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(.97); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .warnbox { background: var(--warn-weak); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .warnbox a { color: inherit; font-weight: 600; }
  ol { margin: 0; padding-left: 22px; } ol li { margin: 6px 0; }
  a { color: var(--accent); }
  .dev { display: flex; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .dev .grow { min-width: 180px; }
  .dev:first-of-type { border-top: 0; padding-top: 2px; }
  .dev .name { font-weight: 600; word-break: break-all; }
  .dev .meta { color: var(--muted); font-size: 12.5px; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--ok-weak); color: var(--ok); font-weight: 600; margin-left: 6px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 18px; }
  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-size: 14px; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #down { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/admin/icon.svg" alt="">
    <div class="grow">
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <label><span data-t="lang"></span>&nbsp;<select id="lang"></select></label>
  </header>

  <div class="pills">
    <span class="pill" id="pSvc"><span class="dot"></span><span></span></span>
    <span class="pill" id="pAg"><span class="dot"></span><span></span></span>
  </div>

  <div class="card warnbox" id="down" data-t="svcDownLong"></div>
  <div class="card warnbox" id="agWhy" style="display:none"><span id="agWhyText"></span>
    <div class="btns"><button id="copyDiag" data-t="copyDiag"></button></div></div>

  <div class="row2">
    <div class="card">
      <h2 data-t="codeTitle"></h2>
      <div class="big" id="code">------</div>
      <p class="hint" data-t="codeHint"></p>
      <div class="btns">
        <button id="copyCode" data-t="copy"></button>
        <button class="ghost" id="newCode" data-t="newCode"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="addrTitle"></h2>
      <div id="addrs"></div>
      <p class="hint" id="addrHint"></p>
    </div>
  </div>

  <div class="card">
    <h2 data-t="stepsTitle"></h2>
    <ol>
      <li><span data-t="step1"></span> <a href="https://tailscale.com/download" target="_blank" rel="noopener" data-t="getTs"></a></li>
      <li id="step2"></li>
      <li data-t="step3"></li>
    </ol>
  </div>

  <div class="card">
    <h2 data-t="devTitle"></h2>
    <div id="devs"></div>
  </div>

  <footer data-t="localOnly"></footer>
</div>
<div id="toast"></div>

function detectLang() {
  try { const s = localStorage.getItem('agr-lang'); if (s && T[s]) return s; } catch {}
  for (const raw of navigator.languages || [navigator.language || 'en']) {
    const l = raw.toLowerCase();
    if (l.startsWith('zh')) return /hk|mo/.test(l) ? 'zh-HK' : /tw|hant/.test(l) ? 'zh-TW' : 'zh-CN';
    const base = l.split('-')[0];
    if (T[base]) return base;
  }
  return 'en';
}
let lang = detectLang();

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast(t('copied'));
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  try { return new Intl.DateTimeFormat(lang, { dateStyle: 'medium', timeStyle: 'short' }).format(d); } catch { return d.toLocaleString(); }
}
function relTime(iso) {
  const sec = Math.round((new Date(iso) - Date.now()) / 1000);
  const units = [['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  for (const [u, s] of units) if (Math.abs(sec) >= s || u === 'second') {
    try { return new Intl.RelativeTimeFormat(lang, { numeric: 'auto' }).format(Math.round(sec / s), u); } catch { return fmtTime(iso); }
  }
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: 'no-store' } : {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-AGR-Admin': '1' }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('lang').value = lang;
}
function render() {
  const s = state;
  $('down').style.display = alive ? 'none' : 'block';
  const svc = $('pSvc'); svc.className = 'pill ' + (alive ? 'ok' : 'bad'); svc.lastElementChild.textContent = alive ? t('svcOk') : t('svcDown');
  const ag = $('pAg'); ag.style.display = alive ? '' : 'none';
  ag.className = 'pill ' + (s?.antigravity ? 'ok' : 'warn'); ag.lastElementChild.textContent = s?.antigravity ? t('agOk') : t('agNo');
  // Antigravity 没连上时说明具体原因（来自服务端的查找记录）
  const why = alive && s && !s.antigravity;
  $('agWhy').style.display = why ? 'block' : 'none';
  if (why) $('agWhyText').textContent = t('agWhy_' + (s.agState || 'pending'));
  if (!s) return;

  $('code').textContent = s.code;
  const addrs = s.addrs || [];
  $('addrs').innerHTML = addrs.length
    ? addrs.map(a => `<div class="addr"><span class="mono">${esc(a)}</span><button data-copy="${esc(a)}">${esc(t('copy'))}</button></div>`).join('')
    : `<div class="warnbox">${esc(t('noTs'))} <a href="https://tailscale.com/download" target="_blank" rel="noopener">${esc(t('getTs'))}</a></div>`;
  $('addrHint').textContent = addrs.length ? t('addrHint', { port: s.port }) : '';
  const dl = addrs.length ? `http://${addrs[0]}:${s.port}/dl` : '';
  $('step2').innerHTML = dl ? esc(t('step2', { url: '\u0000' })).replace('\u0000', `<span class="mono">${esc(dl)}</span> <button data-copy="${esc(dl)}">${esc(t('copy'))}</button>`) : esc(t('step2NoAddr'));

  const devs = s.devices || [];
  $('devs').innerHTML = devs.length ? devs.map(d => {
    const seen = d.online ? `<span class="tag">${esc(t('online'))}</span>` : '';
    const meta = [d.lastSeen && !d.online ? t('lastSeen', { t: relTime(d.lastSeen) }) : (!d.lastSeen ? t('notSeen') : ''),
      d.pairedAt ? t('pairedAt', { t: fmtTime(d.pairedAt) }) : '', d.ip].filter(Boolean).map(esc).join(' · ');
    return `<div class="dev"><div class="grow"><div class="name">${esc(d.name || '—')}${seen}</div><div class="meta">${meta}</div></div>
      <button class="ghost" data-rename="${esc(d.id)}">${esc(t('rename'))}</button>
      <button class="danger" data-remove="${esc(d.id)}">${esc(t('remove'))}</button></div>`;
  }).join('') : `<div class="empty">${esc(t('devNone'))}</div>`;
}

async function refresh() {
  try {
    const s = await api('/admin/api/state');
    const ids = new Set(s.devices.map(d => d.id));
    if (knownIds) for (const d of s.devices) if (!knownIds.has(d.id)) toast(t('newDevice', { name: d.name || '—' }));
    knownIds = ids; state = s; alive = true;
  } catch { alive = false; }
  render();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.copy) return copy(b.dataset.copy);
    if (b.id === 'copyCode' && state) return copy(state.code);
    if (b.id === 'copyDiag') {
      const d = await api('/admin/api/diagnostics');
      await copy('AG Remote diagnostics\n```json\n' + JSON.stringify(d, null, 2) + '\n```');
      return toast(t('diagCopied'));
    }
    if (b.id === 'newCode') { if (!confirm(t('newCodeConfirm'))) return; state = await api('/admin/api/new-code', {}); return render(); }
    if (b.dataset.rename) {
      const d = state.devices.find(x => x.id === b.dataset.rename);
      const name = prompt(t('renamePrompt'), d?.name || ''); if (!name || !name.trim()) return;
      state = await api('/admin/api/rename', { id: b.dataset.rename, name: name.trim() }); return render();
    }
    if (b.dataset.remove) {
      const d = state.devices.find(x => x.id === b.dataset.remove);
      if (!confirm(t('removeConfirm', { name: d?.name || '—' }))) return;
      state = await api('/admin/api/remove', { id: b.dataset.remove });
      knownIds = new Set(state.devices.map(x => x.id)); return render();
    }
  } catch (err) { toast(t('failed', { e: err.message })); }
});

const sel = $('lang');
sel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('');
sel.addEventListener('change', () => { lang = sel.value; try { localStorage.setItem('agr-lang', lang); } catch {} renderStatic(); render(); });

renderStatic(); render(); refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
